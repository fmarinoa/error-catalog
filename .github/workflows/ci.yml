name: CI

on:
  pull_request:
    branches: [main]
  # publish.yml runs the same checks before publishing
  workflow_call:

permissions:
  contents: read

# a new push to the same PR cancels the run it supersedes
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # pnpm's version comes from packageManager in package.json
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm test
      # what npm would publish: dist/, README.md, LICENSE, package.json
      - run: pnpm pack --dry-run
